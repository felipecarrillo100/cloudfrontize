# MinIO: an S3-compatible server for local development.
# `docker compose up -d` starts it and uploads ./site to the bucket "my-site".
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30
  setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    volumes: ["./site:/site:ro"]
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/my-site &&
             mc cp --recursive /site/ local/my-site/"
