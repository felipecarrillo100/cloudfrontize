name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  ui:
    # The WebUI: lint, type-check and production build (its tests run locally: npm test --prefix ui-src)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-src/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix ui-src

      - name: Lint
        run: npm run lint --prefix ui-src

      - name: Typecheck
        run: npm run typecheck --prefix ui-src

      - name: Build
        run: npm run build --prefix ui-src
