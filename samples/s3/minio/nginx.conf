events {
    worker_connections 1024;
}

http {
    # Allow large headers (common in S3 API calls)
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # ----------------------------------------------------
    # Port 9001: MinIO Console Proxy
    # ----------------------------------------------------
    server {
        listen 9001;
        server_name _;

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://minio:9001;
            
            # WebSocket support for the console
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ----------------------------------------------------
    # Port 9000: Website Mode (Virtual-Hosted Style)
    # E.g., http://<bucket>.localhost:9000/
    # ----------------------------------------------------
    server {
        listen 9000;
        server_name ~^(?<bucket>.+)\.localhost$;

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            # Append index.html to requests ending in a trailing slash
            rewrite ^(.*/)$ $1index.html;

            # Translate virtual-host to path-style for internal MinIO
            proxy_set_header Host localhost:9000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://minio:9000/$bucket$uri$is_args$args;
        }
    }

    # ----------------------------------------------------
    # Port 9000: Standard S3 API (Path Style)
    # E.g., http://localhost:9000/<bucket>/
    # ----------------------------------------------------
    server {
        listen 9000 default_server;
        server_name _;

        ignore_invalid_headers off;
        client_max_body_size 0;
        proxy_buffering off;

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://minio:9000;
        }
    }
}
